# Home Assistant automations for the Lenovo K3 PRO ESPHome speaker.
# Paste into automations.yaml (or create via UI -> Edit in YAML).
# Entity ids are generated by ESPHome from the device + entity names.

- id: k3_pro_wake_word_night
  alias: "K3 Pro: wake word off at night"
  mode: single
  triggers:
    - trigger: time
      at: "23:00:00"
      id: night
    - trigger: time
      at: "07:00:00"
      id: morning
  actions:
    - action: >-
        {{ 'switch.turn_off' if trigger.id == 'night' else 'switch.turn_on' }}
      target:
        entity_id: switch.lenovo_3k_pro_speaker_613b3e_wake_word
